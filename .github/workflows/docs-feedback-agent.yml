name: Docs Feedback Agent

on:
  issues:
    types:
      - opened
      - labeled

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  trigger-agent:
    runs-on: ubuntu-latest

    if: |
      (
        contains(github.event.issue.labels.*.name, 'Docs Feedback') ||
        github.event.label.name == 'Docs Feedback'
      ) &&
      github.event.issue.user.login == vars.DOCS_FEEDBACK_ALLOWED_USER

    steps:
      - name: Assign issue to Copilot
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "The COPILOT_ASSIGNMENT_TOKEN repository secret is not configured."
            exit 1
          fi

          jq -n \
            --arg target_repository "$TARGET_REPOSITORY" \
            --arg base_branch "$BASE_BRANCH" \
            '{
              assignees: ["copilot-swe-agent[bot]"],
              agent_assignment: {
                target_repo: $target_repository,
                base_branch: $base_branch,
                custom_instructions: "",
                custom_agent: "docs-editor",
                model: "gpt-5.6-luna"
              }
            }' |
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$TARGET_REPOSITORY/issues/$ISSUE_NUMBER/assignees" \
              --input -